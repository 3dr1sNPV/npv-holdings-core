name: House EDRIS Theme Automation Daemon

on:
  workflow_dispatch: # Allows manual trigger anytime from GitHub
  schedule:
    - cron: '0 2 * * *' # Runs automatically every night at 02:00 UTC

permissions:
  contents: write

jobs:
    deploy-theme:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Set up Python 3.11
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install requests

        - name: Execute House EDRIS Theme Generator
          env:
            SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
            SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
          run: |
            python3 npv_theme_generator.py

        - name: Commit State & Build Artifacts to Ledger
          run: |
            git config --global user.name "edris-theme-daemon"
            git config --global user.email "theme-daemon@npvholdings.internal"
            git add ledger/ || true
            git commit -m "chore: automated House EDRIS theme state sync [skip ci]" || echo "No changes to commit"
            git push || true
