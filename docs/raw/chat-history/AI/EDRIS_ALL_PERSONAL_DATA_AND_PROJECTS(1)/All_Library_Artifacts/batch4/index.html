<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>TUX GEN UI</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#f4f1e9;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;min-height:100vh}.phone{width:min(100%,430px);min-height:100vh;background:linear-gradient(160deg,#050b08,#0b110e 55%,#050706);padding:28px 22px 32px;position:relative;overflow:hidden}.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:#183c2d;filter:blur(90px);opacity:.25;right:-100px;top:120px}.brand small{font-size:12px;letter-spacing:.12em;opacity:.7}.brand h1{font-family:Georgia,serif;font-size:34px;letter-spacing:.12em;margin:5px 0 0;font-weight:500}.rabbit{font-size:13px;vertical-align:middle;opacity:.8}.sub{margin-top:32px;color:#a9afa9;font-size:13px;letter-spacing:.08em}.hero{margin-top:16px;border:1px solid #29342e;border-radius:28px;padding:22px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));backdrop-filter:blur(18px)}.figure{height:260px;display:flex;align-items:center;justify-content:center}.man{width:118px;height:215px;position:relative}.head{width:43px;height:43px;border-radius:50%;background:#d5d0c4;margin:auto}.body{position:absolute;top:43px;left:16px;width:86px;height:130px;background:linear-gradient(90deg,#050505,#161a17,#050505);clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}.lapel{position:absolute;top:50px;left:40px;width:38px;height:65px;border-left:2px solid #aaa;transform:skewY(25deg)}.legs{position:absolute;top:166px;left:28px;width:62px;height:50px;border-left:19px solid #070707;border-right:19px solid #070707}.label{display:flex;justify-content:space-between;align-items:end}.label strong{font-size:19px}.label span{font-size:11px;color:#9da59f}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}.mode{padding:14px 9px;border:1px solid #29342e;border-radius:16px;text-align:center;font-size:10px;letter-spacing:.1em;color:#b8beb9}.mode.active{border-color:#b8a77a;background:rgba(184,167,122,.09);color:#eee8d9}.stats{display:flex;gap:10px;margin-top:18px}.stat{flex:1;border:1px solid #263029;border-radius:16px;padding:13px}.stat b{font-size:19px}.stat span{display:block;color:#8f9791;font-size:10px;margin-top:3px}.flow{margin-top:23px;display:flex;justify-content:space-between;color:#7f8881;font-size:8px;letter-spacing:.08em}.flow .on{color:#d9c99d}.button{margin-top:23px;width:100%;border:0;border-radius:18px;padding:17px;background:#e6decb;color:#10120f;font-weight:700;letter-spacing:.12em;font-size:12px}.lang{position:absolute;right:22px;top:28px;border:1px solid #29342e;border-radius:20px;padding:8px 11px;font-size:10px;color:#bfc5bf}
</style></head><body><main class="phone"><div class="glow"></div><div class="lang">EN · فارسی</div><section class="brand"><small>Uncle Ed’s</small><h1>TUX <span class="rabbit">♟</span> GEN</h1></section><div class="sub">YOUR DIGITAL BESPOKE TAILOR</div><section class="hero"><div class="figure"><div class="man"><div class="head"></div><div class="body"></div><div class="lapel"></div><div class="legs"></div></div></div><div class="label"><strong>Your Master Fit</strong><span>180 cm · 90 kg</span></div><div class="modes"><div class="mode">QUICK</div><div class="mode">GUIDED</div><div class="mode active">BESPOKE</div></div><div class="stats"><div class="stat"><b>27</b><span>DIMENSIONS</span></div><div class="stat"><b>24</b><span>HIGH CONFIDENCE</span></div></div></section><div class="flow"><span class="on">MEASURE</span><span>SCAN</span><span>FIT</span><span>DESIGN</span><span>PREVIEW</span><span>TAILOR</span></div><button class="button">START FITTING</button></main></body></html>
